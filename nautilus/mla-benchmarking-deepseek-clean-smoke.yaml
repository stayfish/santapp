apiVersion: batch/v1
kind: Job
metadata:
  name: mla-benchmarking-deepseek-clean-smoke
  namespace: ucsb-opus-lab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: mla-benchmarking-deepseek-clean-smoke
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - Tesla-V100-SXM2-32GB
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - cph-dgx-node2.humboldt.edu
      containers:
        - name: benchmark
          image: ghcr.io/stayfish/santapp-benchmark:deepseek-diagnostic-v2
          imagePullPolicy: IfNotPresent
          args:
            - python
            - /opt/santapp/exp/mla_benchmarking.py
            - --model
            - /opt/models/DeepSeek-V2-Lite
            - --num-prompts
            - "2"
            - --context-length
            - "4096"
            - --output
            - /runtime/results/deepseek-clean-smoke
            - --model-args
            - trust_remote_code=True,dtype=float16,load_in_4bit=True,bnb_4bit_quant_type=nf4,bnb_4bit_use_double_quant=True,attn_implementation=eager,parallelize=True,device_map_option=sequential
          env:
            - {name: BENCHMARK_ROOT, value: /runtime}
            - {name: HF_HOME, value: /runtime/huggingface}
            - {name: HF_HUB_ENABLE_HF_TRANSFER, value: "0"}
          resources:
            requests: {cpu: "4", memory: 48Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 48Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: runtime, mountPath: /runtime}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - {name: runtime, emptyDir: {sizeLimit: 10Gi}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 4Gi}}
