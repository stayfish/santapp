apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: santapp
  namespace: ucsb-opus-lab
spec:
  storageClassName: rook-ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mla-benchmarking
  namespace: ucsb-opus-lab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: mla-benchmarking
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-mountain
      initContainers:
        - name: clone-source
          image: alpine/git:2.47.2
          args:
            - clone
            - --depth=1
            - --branch=main
            - https://github.com/stayfish/santapp.git
            - /opt/santapp
          volumeMounts:
            - name: source
              mountPath: /opt/santapp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 1Gi
      containers:
        - name: benchmark
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          command:
            - /bin/bash
            - -lc
          args:
            - >-
              python -m pip install --no-cache-dir
              "typing_extensions>=4.15" "transformers>=4.40,<5"
              "lm-eval[hf,ruler]"
              && sed -i
              "s|http://curtis.ml.cmu.edu/datasets/hotpot/hotpot_dev_distractor_v1.json|https://huggingface.co/datasets/namlh2004/hotpotqa/resolve/main/hotpot_dev_distractor_v1.json?download=true|"
              /opt/conda/lib/python3.11/site-packages/lm_eval/tasks/ruler/qa_utils.py
              && python /opt/santapp/exp/mla_benchmarking.py --num-prompts 2
          env:
            - name: BENCHMARK_ROOT
              value: /workspace
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 20Gi
              nvidia.com/a40: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 20Gi
              nvidia.com/a40: "1"
          volumeMounts:
            - name: source
              mountPath: /opt/santapp
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: source
          emptyDir: {}
        - name: workspace
          persistentVolumeClaim:
            claimName: santapp
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
