apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: santapp
  namespace: ucsb-opus-lab
spec:
  storageClassName: rook-ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mla-benchmarking-v100-smoke
  namespace: ucsb-opus-lab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: mla-benchmarking-v100-smoke
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - us-west
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - Tesla-V100-SXM2-32GB
      containers:
        - name: benchmark
          image: ghcr.io/stayfish/santapp-benchmark:deepseek-v2-lite-v1
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -lc
          args:
            - >-
              python /opt/santapp/exp/mla_benchmarking.py
              --model /opt/models/DeepSeek-V2-Lite
              --num-prompts 2
              --context-length 4096
              --output /runtime/results/v100-smoke
              --model-args
              "trust_remote_code=True,dtype=float16,load_in_8bit=True"
          env:
            - name: BENCHMARK_ROOT
              value: /runtime
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 10Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 10Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: runtime
              mountPath: /runtime
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: 10Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
