apiVersion: batch/v1
kind: Job
metadata:
  name: mla-deepseek-full
  namespace: ucsb-opus-lab
spec:
  completionMode: Indexed
  completions: 6
  parallelism: 6
  backoffLimitPerIndex: 0
  maxFailedIndexes: 6
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: mla-deepseek-full
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A40
                      - NVIDIA-RTX-A6000
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-80GB-PCIe
                      - NVIDIA-A100-PCIE-40GB
      containers:
        - name: benchmark
          image: ghcr.io/stayfish/santapp-benchmark:deepseek-diagnostic-v3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              tasks=(
                niah_single_2
                niah_multikey_2
                niah_multiquery
                ruler_vt
                ruler_cwe
                ruler_qa_hotpot
              )
              task="${tasks[$JOB_COMPLETION_INDEX]}"
              exec python /opt/santapp/exp/mla_benchmarking.py \
                --model /opt/models/DeepSeek-V2-Lite \
                --num-prompts 20 \
                --context-length 8192 \
                --tasks "$task" \
                --output "/runtime/results/$task" \
                --model-args "trust_remote_code=True,dtype=float16,attn_implementation=eager,parallelize=True,device_map=sequential"
          env:
            - {name: BENCHMARK_ROOT, value: /runtime}
            - {name: HF_HOME, value: /runtime/huggingface}
            - {name: HF_HUB_ENABLE_HF_TRANSFER, value: "0"}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TRANSFORMERS_OFFLINE, value: "0"}
          resources:
            requests: {cpu: "4", memory: 48Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 48Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: runtime, mountPath: /runtime}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - {name: runtime, emptyDir: {sizeLimit: 10Gi}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 4Gi}}
