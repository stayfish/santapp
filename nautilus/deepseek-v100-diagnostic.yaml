apiVersion: batch/v1
kind: Job
metadata:
  name: deepseek-v100-diagnostic
  namespace: ucsb-opus-lab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: deepseek-v100-diagnostic
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - Tesla-V100-SXM2-32GB
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - cph-dgx-node2.humboldt.edu
      containers:
        - name: diagnostic
          image: ghcr.io/stayfish/santapp-benchmark:deepseek-diagnostic-v2
          imagePullPolicy: IfNotPresent
          args:
            - python
            - /opt/santapp/exp/deepseek_diagnostic.py
          env:
            - {name: HF_HOME, value: /runtime/huggingface}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
          resources:
            requests: {cpu: "4", memory: 48Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 48Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: runtime, mountPath: /runtime}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - {name: runtime, emptyDir: {sizeLimit: 10Gi}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 4Gi}}
