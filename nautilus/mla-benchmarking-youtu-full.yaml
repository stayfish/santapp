apiVersion: batch/v1
kind: Job
metadata:
  name: mla-youtu-niah-single-2
  namespace: ucsb-opus-lab
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app: mla-benchmarking-youtu-full
        ruler-task: niah-single-2
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: ghcr.io/stayfish/santapp-benchmark:youtu-llm-2b-v3
          imagePullPolicy: Always
          args: ["python", "/opt/santapp/exp/mla_benchmarking.py", "--model", "/opt/models/Youtu-LLM-2B", "--num-prompts", "20", "--context-length", "8192", "--tasks", "niah_single_2", "--output", "/runtime/results/niah-single-2", "--model-args", "trust_remote_code=True,dtype=float16"]
          env: &benchmark-env
            - {name: BENCHMARK_ROOT, value: /runtime}
            - {name: HF_HUB_ENABLE_HF_TRANSFER, value: "0"}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TRANSFORMERS_OFFLINE, value: "0"}
          resources: &benchmark-resources
            requests: {cpu: "4", memory: 24Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 24Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
          volumeMounts: &benchmark-mounts
            - {name: runtime, mountPath: /runtime}
            - {name: dshm, mountPath: /dev/shm}
      volumes: &benchmark-volumes
        - {name: runtime, emptyDir: {sizeLimit: 10Gi}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 4Gi}}
---
