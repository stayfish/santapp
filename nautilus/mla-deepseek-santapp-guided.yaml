apiVersion: batch/v1
kind: Job
metadata:
  name: mla-deepseek-santapp-guided
  namespace: ucsb-opus-lab
spec:
  completionMode: Indexed
  completions: 6
  parallelism: 6
  backoffLimitPerIndex: 0
  maxFailedIndexes: 6
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: mla-deepseek-santapp-guided
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-80GB-PCIe
      containers:
        - name: benchmark
          image: ghcr.io/stayfish/santapp-benchmark:deepseek-diagnostic-v3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              python -m pip install --no-cache-dir --upgrade \
                "transformers==5.12.1" \
                "tokenizers>=0.22,<0.23" \
                "accelerate" \
                "bitsandbytes>=0.45" \
                "typing_extensions>=4.15" \
                "lm-eval[hf,ruler]" \
                "numpy"
              tasks=(
                niah_single_2
                niah_multikey_2
                niah_multiquery
                ruler_vt
                ruler_cwe
                ruler_qa_hotpot
              )
              task="${tasks[$JOB_COMPLETION_INDEX]}"
              exec python -m exp.mla_santapp_benchmark \
                --architecture deepseek-v2 \
                --model /opt/models/DeepSeek-V2-Lite \
                --mode guided \
                --dtype float16 \
                --num-prompts 20 \
                --context-length 8192 \
                --cluster-size 16 \
                --token-budget 128 \
                --recent-window 64 \
                --kmeans-iterations 20 \
                --tasks "$task" \
                --output "/runtime/results/deepseek-guided/$task"
          env:
            - {name: BENCHMARK_ROOT, value: /runtime}
            - {name: HF_HOME, value: /runtime/huggingface}
            - {name: HF_HUB_ENABLE_HF_TRANSFER, value: "0"}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: TRANSFORMERS_OFFLINE, value: "1"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
          resources:
            requests: {cpu: "4", memory: 64Gi, ephemeral-storage: 15Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 64Gi, ephemeral-storage: 15Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: code, mountPath: /opt/santapp/exp}
            - {name: runtime, mountPath: /runtime}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: code
          configMap:
            name: deepseek-santapp-code
            items:
              - {key: mla_benchmarking.py, path: mla_benchmarking.py}
              - {key: mla_santapp_benchmark.py, path: mla_santapp_benchmark.py}
              - {key: santapp_init.py, path: santapp/__init__.py}
              - {key: attention.py, path: santapp/attention.py}
              - {key: clustering.py, path: santapp/clustering.py}
              - {key: config.py, path: santapp/config.py}
              - {key: deepseek_attention.py, path: santapp/deepseek_attention.py}
              - {key: minibatch_kmeans.py, path: santapp/minibatch_kmeans.py}
        - {name: runtime, emptyDir: {sizeLimit: 15Gi}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
