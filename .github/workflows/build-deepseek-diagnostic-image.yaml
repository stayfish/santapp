name: Build DeepSeek diagnostic image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile.deepseek-diagnostic
      - exp/deepseek_diagnostic.py
      - .github/workflows/build-deepseek-diagnostic-image.yaml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/santapp-benchmark

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.deepseek-diagnostic
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:deepseek-diagnostic-v3
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
